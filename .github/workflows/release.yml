name: Release

# Pushing a tag like `v0.9.0` publishes the release: it re-runs the suite,
# builds the static binary the releases have always carried, checks that the
# tag and the compiler agree, and uploads the binary with its checksum.
#
#   git tag -a v0.9.0 -m "Ducky v0.9.0 — ..." && git push origin v0.9.0
#
# Hand-written notes go in `release-notes/v0.9.0.md`; when that file is
# missing the notes are generated from the commits since the previous tag.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the generated notes need the previous tags

      - name: Build
        run: make clean && make

      - name: Test suite
        run: make test

      - name: Examples
        run: make examples

      - name: Zero warnings check
        run: |
          make clean
          out=$(make 2>&1)
          echo "$out"
          if echo "$out" | grep -E 'warning:'; then
            echo "compiler warnings found" >&2
            exit 1
          fi

      - name: The tag and the compiler must agree
        run: |
          want="${GITHUB_REF_NAME#v}"
          got="$(./duckyc --version | awk '{print $2}')"
          echo "tag: $want  compiler: $got"
          if [ "$want" != "$got" ]; then
            echo "tag '$GITHUB_REF_NAME' does not match DUCKYC_VERSION '$got'" >&2
            exit 1
          fi

      - name: Build the static release binary
        run: |
          make clean
          make LDFLAGS=-static
          cp duckyc duckyc-linux-x86_64
          file duckyc-linux-x86_64
          if ! file duckyc-linux-x86_64 | grep -q 'statically linked'; then
            echo "duckyc-linux-x86_64 is not statically linked" >&2
            exit 1
          fi
          sha256sum duckyc-linux-x86_64 > duckyc-linux-x86_64.sha256
          cat duckyc-linux-x86_64.sha256

      - name: Smoke test the release binary
        run: |
          ./duckyc-linux-x86_64 examples/hello.duck -o /tmp/hello
          /tmp/hello
          ./duckyc-linux-x86_64 --version

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets="duckyc-linux-x86_64 duckyc-linux-x86_64.sha256"
          notes="release-notes/${GITHUB_REF_NAME}.md"

          if [ -f "$notes" ]; then
            notes_args=(--notes-file "$notes")
          else
            notes_args=(--generate-notes)
          fi

          # A re-run has to be able to publish again rather than fail, so an
          # existing release gets its assets replaced instead of a new one.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --clobber $assets
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --verify-tag --latest \
              --title "Ducky ${GITHUB_REF_NAME}" \
              "${notes_args[@]}" \
              $assets
          fi
